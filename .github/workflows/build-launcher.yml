name: Build iappyxOS Launcher

# Builds the launcher APK in the cloud and publishes it as a release you can
# download and install on your phone.

on:
  workflow_dispatch:      # the green "Run workflow" button

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: src/launcher
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Keep a copy (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: iappyxOS-Launcher-debug
          path: src/launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/launcher/app/build/outputs/apk/debug/app-debug.apk iappyxOS-Launcher.apk
          gh release create "build-${{ github.run_number }}" iappyxOS-Launcher.apk \
            --repo "${{ github.repository }}" \
            --title "Launcher build ${{ github.run_number }}" \
            --notes "Debug APK for Android 10+ (ARM64). Open it on your phone to install." \
            --target "${{ github.sha }}"
